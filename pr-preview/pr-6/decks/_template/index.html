<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck title · Subtitle</title>
  <script src="../../assets/themes.js"></script>
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/engine.css">
  <link rel="stylesheet" href="deck.css">
</head>
<body data-deck="your-deck-id">
<div class="deck">

  <section class="slide dark center">
    <p class="kicker">Topic name</p>
    <h1>A memorable<br>question?</h1>
    <p class="lead">One sentence on what the audience will understand by the end.</p>
    <aside class="notes"><p>What to say on this slide.</p></aside>
  </section>

  <section class="slide">
    <p class="kicker">Section label</p>
    <h2>One idea per slide</h2>
    <div class="card step"><p>Revealed on the first →</p></div>
    <div class="card step" style="margin-top:24px"><p>Revealed on the second →</p></div>
    <aside class="notes"><p>Ask the room a question here.</p></aside>
  </section>

  <section class="slide dark center">
    <h2>The one-line takeaway.</h2>
    <aside class="notes"><p>Close.</p></aside>
  </section>

</div>
<script src="../../assets/sketch.js"></script>
<script src="../../decks/registry.js"></script>
<script src="../../assets/engine.js"></script>
<script src="deck.js"></script>
</body>
</html>
